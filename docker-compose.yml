services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-smartcrop}
      POSTGRES_USER: ${DB_USER:-smartcrop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn smartcrop.wsgi:application --bind 0.0.0.0:8000 --workers 3
    depends_on:
      - db
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_NAME: ${DB_NAME:-smartcrop}
      DB_USER: ${DB_USER:-smartcrop}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
